# Prometheus scrape config for the KnowFlow stack.
#
# Targets resolve by Docker service name on the compose `knowflow` network:
#   - backend    :3000/metrics   HTTP latency/error rate + AI-client latency
#   - ai-service :8000/metrics    AI generation latency/tokens + its HTTP
#   - worker     :8001/metrics    RQ ingestion job outcomes + durations
#
# `job` is the aggregation key the Grafana dashboard filters on.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3000"]

  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8000"]

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8001"]